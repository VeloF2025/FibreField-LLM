# 🟢 WORKING: Gradle configuration for optimal performance and build settings

# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Android build optimizations
android.useAndroidX=true
android.enableJetifier=true
android.enableR8.fullMode=true
android.experimental.enableSourceSetPathsMap=true

# Kotlin optimizations
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.android=true

# Build performance
org.gradle.daemon=true
org.gradle.configuration-cache=true

# Enable non-transitive R classes
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Enable parcelize plugin globally
kotlin.parcelize.generate.values=true

# Compose optimizations
android.suppressUnsupportedCompileSdk=34

# Security settings - Use environment variables or local.properties for production
# These are placeholder values for development only
KEYSTORE_PASSWORD=dev_keystore_password
KEY_ALIAS=dev_key_alias
KEY_PASSWORD=dev_key_password

# API Configuration - Configure in local.properties for environment-specific values
DEBUG_API_BASE_URL=https://dev-api.fibreflow.com/v1/
RELEASE_API_BASE_URL=https://api.fibreflow.com/v1/

# Feature flags
ENABLE_AI_VALIDATION=true
ENABLE_OFFLINE_MAPS=true
ENABLE_ANALYTICS=false
ENABLE_CRASH_REPORTING=false

# Database settings
DATABASE_NAME=fibrefield_encrypted.db
DATABASE_PASSPHRASE_KEY=change_this_in_production

# ML Model settings
LLM_MODEL_PATH=models/phi-3.5-mini-instruct-q4_k_m
VISION_MODEL_PATH=models/ont_light_detector_v2.tflite

# Certificate Pinning - Replace with actual certificate pins in production
# Format: sha256/<base64_encoded_certificate_hash>
CERTIFICATE_PIN_DEV=sha256/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
CERTIFICATE_PIN_PROD=sha256/BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB=